openapi: 3.0.3
info:
  title: OneTicket API
  description: Flash sale ticketing API with JWT auth, event browsing, health checks, and metrics. All responses use a standard wrapper with success, message, data, and errors.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from login or register

  schemas:
    # Standard response wrapper (success)
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          description: Response payload; structure varies by endpoint
        errors:
          type: object
          nullable: true
      required:
        - success
        - message

    # Standard error wrapper
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          type: object
          nullable: true
        errors:
          type: object
          nullable: true
      required:
        - success
        - message

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        email:
          type: string
          format: email

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    RefreshTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          description: Reset token from forgot-password flow
        new_password:
          type: string
          minLength: 8
          format: password

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
          description: Dependency name to status (ok/error)
        uptime_seconds:
          type: integer
          format: int64
          description: Seconds since app start

    MetricsResponse:
      type: object
      properties:
        total_requests:
          type: integer
          format: int64
        success_requests:
          type: integer
          format: int64
        error_requests:
          type: integer
          format: int64
        uptime_seconds:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time

    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        venue:
          type: string
        starts_at:
          type: string
          format: date-time
        sale_starts_at:
          type: string
          format: date-time
        price_cents:
          type: integer
          format: int64
          description: Ticket price in the smallest currency unit. An integer, never a float.
        total_tickets:
          type: integer
          description: Planned inventory for this event.
        available_tickets:
          type: integer
          format: int64
          description: Counted live from the tickets table, so it excludes sold tickets.
        sale_open:
          type: boolean
          description: Whether sale_starts_at has passed.

paths:
  /health:
    get:
      summary: Health check
      description: Returns application and dependency health. Used by Kubernetes, Docker, load balancers.
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /metrics:
    get:
      summary: Application metrics
      description: Returns request counters and uptime. Used for monitoring.
      tags:
        - Health
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MetricsResponse'

  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account. Returns user info and JWT tokens.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request (validation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Login
      description: Authenticate with email and password. Returns user info and JWT tokens.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: Exchange a valid refresh token for new access and refresh tokens.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Missing or invalid refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: Logout (single session)
      description: Revoke one refresh token (this device/session only). Always returns 200, even for an unknown or already-revoked token, so this endpoint cannot be used to probe token validity.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Missing or invalid refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/logout-all:
    post:
      summary: Logout from all devices
      description: Revoke every active refresh token for the authenticated user (all devices/sessions).
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out from all devices successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/auth/forgot-password:
    post:
      summary: Forgot password
      description: >-
        Request a password reset. The response body is identical whether or not the email
        exists, so this endpoint cannot be used to enumerate users, and the reset token is
        never returned over HTTP. Delivery requires a configured EmailSender: in development
        without one the token is written to the application log, and in every other
        environment the request fails with 503.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset initiated (generic message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Password reset unavailable — no mailer configured outside development
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/auth/reset-password:
    post:
      summary: Reset password
      description: Set new password using the token from forgot-password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/profile:
    get:
      summary: Get current user profile
      description: Returns the authenticated user's profile. Requires Bearer token.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/datatables:
    get:
      summary: Example DataTables data
      description: Returns data in DataTables format for server-side processing. Query params follow DataTables convention.
      tags:
        - Example
      parameters:
        - name: draw
          in: query
          schema:
            type: integer
        - name: start
          in: query
          schema:
            type: integer
        - name: length
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: DataTables payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/events:
    get:
      summary: List events
      description: Returns every event with live ticket availability, soonest sale first.
      tags:
        - Events
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventResponse'
        '500':
          description: Failed to list events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/events/{id}:
    get:
      summary: Get an event
      description: Returns a single event with live ticket availability.
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          description: Event id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Event retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventResponse'
        '400':
          description: Invalid event id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Failed to get event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
