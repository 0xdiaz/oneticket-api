name: oneticket

services:
  postgres_db:
    container_name: oneticket_pg_db
    image: postgres:16-alpine
    ports:
      - "5436:5432"
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${MASTER_DB_USER}
      - POSTGRES_PASSWORD=${MASTER_DB_PASSWORD}
      - POSTGRES_DB=${MASTER_DB_NAME}
    volumes:
      - oneticket_postgres_data:/var/lib/postgresql/data/
    restart: always

  pgadmin:
    container_name: oneticket_pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - "5051:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    logging:
      driver: none
    volumes:
      - oneticket_pgadmin_data:/var/lib/pgadmin

  server:
    container_name: oneticket_dev_go_server
    build:
      context: ..
      dockerfile: .docker/Dockerfile-dev
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - postgres_db
    volumes:
      - ..:/app
    restart: always
    env_file:
      - ../.env
    # NOTE: config is read from the .env FILE by viper (config.SetupConfig), not from the
    # process environment, and ../.. is mounted at /app — so this container reads the same
    # ../.env as the host. Setting `environment:` here has no effect on the app config.
    # To run the API in Docker, point ../.env at the compose service:
    #   MASTER_DB_HOST=postgres_db   MASTER_DB_PORT=5432
    # To run it on the host with `go run main.go`, point it at the published port:
    #   MASTER_DB_HOST=localhost     MASTER_DB_PORT=5436

volumes:
  oneticket_postgres_data:
  oneticket_pgadmin_data: